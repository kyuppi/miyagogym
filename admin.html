<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体育館予約 管理画面</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container wide">
  <header>
    <h1>体育館予約 管理画面</h1>
    <p>予約状況の確認・期間と時間による絞り込みができます。</p>
    <a class="admin-link" href="index.html">予約画面へ</a>
  </header>

  <main>
    <section class="card">
      <h2>予約を絞り込む</h2>
      <div class="filter-grid">
        <label>開始日
          <input type="date" id="fromDate">
        </label>
        <label>終了日
          <input type="date" id="toDate">
        </label>
        <label>開始時刻
          <select id="fromTime"></select>
        </label>
        <label>終了時刻
          <select id="toTime"></select>
        </label>
        <label>部活動
          <select id="filterClub">
            <option value="">すべて</option>
            <option>バスケットボール部</option>
            <option>バレーボール部</option>
            <option>バドミントン部</option>
            <option>卓球部</option>
            <option>ダンス部</option>
            <option>その他</option>
          </select>
        </label>
        <label>面
          <select id="filterCourt">
            <option value="">すべて</option>
            <option value="A">A面</option>
            <option value="B">B面</option>
          </select>
        </label>
      </div>
      <div class="button-row">
        <button id="filterBtn" class="primary">検索</button>
        <button id="clearFilterBtn" class="secondary">条件をクリア</button>
      </div>
    </section>

    <section class="card">
      <div class="section-title">
        <h2>予約一覧</h2>
        <span id="count" class="badge">0件</span>
      </div>
      <div id="reservations"></div>
    </section>

    <section class="card danger-card">
      <h2>データ管理</h2>
      <p>テスト用。すべての予約データを削除します。</p>
      <button id="deleteAllBtn" class="danger">全予約を削除</button>
    </section>
  </main>
</div>
<script src="app.js"></script>
<script src="admin.js"></script>
</body>
</html>
