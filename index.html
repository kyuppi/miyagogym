<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体育館予約</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>体育館 使用予約</h1>
    <p>体育館A面・B面の空き状況を確認して予約できます。</p>
    <a class="admin-link" href="admin.html">管理画面</a>
  </header>

  <main class="card">
    <h2>予約する</h2>

    <div class="form-grid">
      <label>使用日
        <input type="date" id="date">
      </label>

      <label>使用する部活動
        <select id="club">
          <option value="">選択してください</option>
          <option>バスケットボール部</option>
          <option>バレーボール部</option>
          <option>バドミントン部</option>
          <option>卓球部</option>
          <option>ダンス部</option>
          <option>その他</option>
        </select>
      </label>

      <label>使用開始時刻
        <select id="startTime"></select>
      </label>

      <label>使用終了時刻
        <select id="endTime"></select>
      </label>
    </div>

    <h3>使用する面</h3>
    <div class="court-options">
      <label class="court-option"><input type="checkbox" name="court" value="A"> A面</label>
      <label class="court-option"><input type="checkbox" name="court" value="B"> B面</label>
    </div>

    <button id="checkBtn" class="primary">空き状況を確認</button>

    <div id="availability" class="result hidden"></div>

    <div id="reservationArea" class="hidden">
      <div class="notice success">選択した時間・面は予約可能です。</div>
      <label>予約者名
        <input type="text" id="name" placeholder="例：山田太郎">
      </label>
      <button id="reserveBtn" class="primary">この内容で予約する</button>
    </div>

    <div id="message"></div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
